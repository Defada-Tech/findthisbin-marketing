<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  @media (max-width: 860px){
    .ftb-navlinks{ display:none !important; }
    .ftb-burger{ display:inline-flex !important; }
    .ftb-signin{ display:none !important; }
  }
  @media (min-width: 861px){
    .ftb-mobilemenu{ display:none !important; }
  }
</style>
</helmet>
<header style="position:sticky; top:0; z-index:1000; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); background:{{ navBg }}; borderBottom:{{ navBorder }}; transition:background .3s ease, border-color .3s ease; fontFamily:'Inter',sans-serif;">
  <nav aria-label="Primary" style="max-width:1240px; margin:0 auto; padding:0 24px; height:68px; display:flex; align-items:center; justify-content:space-between; gap:24px;">
    <a href="Home.dc.html" aria-label="FindThisBIN home" style="display:flex; align-items:center; gap:2px; text-decoration:none; fontFamily:'Space Grotesk',sans-serif; fontWeight:700; fontSize:21px; letterSpacing:-0.02em; flex:none;">
      <span style="color:#FFFFFF;">FindThis</span><span style="color:#22D3EE;">BIN</span>
    </a>
    <div class="ftb-navlinks" style="display:flex; align-items:center; gap:34px; margin-left:8px; margin-right:auto;">
      <a href="Home.dc.html#product" style="text-decoration:none; fontSize:15px; fontWeight:500; color:{{ cProduct }}; transition:color .2s;" style-hover="color:#FFFFFF;">Product</a>
      <a href="Pricing.dc.html" style="text-decoration:none; fontSize:15px; fontWeight:500; color:{{ cPricing }}; transition:color .2s;" style-hover="color:#FFFFFF;">Pricing</a>
      <a href="Docs.dc.html" style="text-decoration:none; fontSize:15px; fontWeight:500; color:{{ cDocs }}; transition:color .2s;" style-hover="color:#FFFFFF;">Docs</a>
      <a href="Home.dc.html#company" style="text-decoration:none; fontSize:15px; fontWeight:500; color:{{ cCompany }}; transition:color .2s;" style-hover="color:#FFFFFF;">Company</a>
    </div>
    <div style="display:flex; align-items:center; gap:18px; flex:none;">
      <a class="ftb-signin" href="Home.dc.html#" style="text-decoration:none; fontSize:15px; fontWeight:500; color:#C7C7D6;" style-hover="color:#FFFFFF;">Sign in</a>
      <a href="Pricing.dc.html#tiers" style="text-decoration:none; fontSize:14.5px; fontWeight:600; color:#0B0B12; background:#C4F542; padding:10px 18px; border-radius:10px; whiteSpace:nowrap; boxShadow:0 0 0 1px rgba(196,245,66,0.4), 0 8px 24px -8px rgba(196,245,66,0.45); transition:transform .15s ease, box-shadow .15s ease;" style-hover="transform:translateY(-1px); boxShadow:0 0 0 1px rgba(196,245,66,0.6), 0 12px 28px -8px rgba(196,245,66,0.6);">Get your free API key</a>
      <button class="ftb-burger" onClick="{{ toggleMenu }}" aria-label="Toggle menu" aria-expanded="{{ menuOpen }}" style="display:none; align-items:center; justify-content:center; width:40px; height:40px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.04); border-radius:10px; cursor:pointer; color:#fff; padding:0;">
        <span style="display:block; width:18px; height:0;">
          <span style="display:block; width:18px; height:2px; background:#fff; margin:3px 0; border-radius:2px;"></span>
          <span style="display:block; width:18px; height:2px; background:#fff; margin:3px 0; border-radius:2px;"></span>
          <span style="display:block; width:18px; height:2px; background:#fff; margin:3px 0; border-radius:2px;"></span>
        </span>
      </button>
    </div>
  </nav>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div class="ftb-mobilemenu" style="background:rgba(11,11,18,0.97); borderTop:1px solid rgba(255,255,255,0.08); padding:18px 24px 26px; display:flex; flex-direction:column; gap:6px;">
      <a href="Home.dc.html#product" style="text-decoration:none; fontSize:17px; fontWeight:600; color:#E7E7F0; padding:12px 0;">Product</a>
      <a href="Pricing.dc.html" style="text-decoration:none; fontSize:17px; fontWeight:600; color:#E7E7F0; padding:12px 0;">Pricing</a>
      <a href="Docs.dc.html" style="text-decoration:none; fontSize:17px; fontWeight:600; color:#E7E7F0; padding:12px 0;">Docs</a>
      <a href="Home.dc.html#company" style="text-decoration:none; fontSize:17px; fontWeight:600; color:#E7E7F0; padding:12px 0;">Company</a>
      <a href="Home.dc.html#" style="text-decoration:none; fontSize:17px; fontWeight:600; color:#9A9AAE; padding:12px 0; borderTop:1px solid rgba(255,255,255,0.07); margin-top:6px;">Sign in</a>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:420},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;product&quot;,&quot;pricing&quot;,&quot;docs&quot;,&quot;company&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { scrolled:false, menuOpen:false };
  componentDidMount(){
    this.onScroll = () => {
      const s = window.scrollY > 12;
      if (s !== this.state.scrolled) this.setState({ scrolled:s });
    };
    window.addEventListener('scroll', this.onScroll, { passive:true });
    this.onScroll();
  }
  componentWillUnmount(){ window.removeEventListener('scroll', this.onScroll); }
  renderVals(){
    const active = this.props.active || '';
    const on = '#FFFFFF', off = '#9A9AAE';
    return {
      navBg: this.state.scrolled ? 'rgba(11,11,18,0.85)' : 'rgba(11,11,18,0.32)',
      navBorder: this.state.scrolled ? '1px solid rgba(255,255,255,0.08)' : '1px solid rgba(255,255,255,0.0)',
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      cProduct: active === 'product' ? on : off,
      cPricing: active === 'pricing' ? on : off,
      cDocs: active === 'docs' ? on : off,
      cCompany: active === 'company' ? on : off,
    };
  }
}
</script>
</body>
</html>
